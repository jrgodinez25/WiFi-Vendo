<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administrator Login · WiFi Vendo</title><link rel="stylesheet" href="/styles.css"><style>
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:#f2f5fa}.login-card{width:min(100%,420px);padding:30px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 18px 55px #172b4814}.login-brand{font-size:20px;font-weight:800;color:#17365f}.login-card h1{font-size:25px;margin:28px 0 7px}.login-card p{color:#718096;font-size:13px;line-height:1.6}.login-card label{display:grid;gap:8px;margin:22px 0 14px;font-size:12px;font-weight:700;color:#45566f}.login-card input{height:48px;padding:0 13px;border:1px solid #d8e1ed;border-radius:9px;font:inherit}.login-card button{width:100%;height:47px;border:0;border-radius:9px;background:#245fba;color:white;font-weight:800;cursor:pointer}.login-error{min-height:20px;color:#a23d4d!important}.login-note{font-size:11px!important;margin-top:20px}
</style></head><body><main class="login-card"><div class="login-brand">◉ WiFi Vendo</div><h1>Administrator sign in</h1><p>Access is restricted to trusted management IP addresses and an administrator password.</p><form id="login-form"><label for="password">Administrator password<input id="password" name="password" type="password" autocomplete="current-password" minlength="12" required autofocus></label><button id="submit" type="submit">Sign in</button><p id="error" class="login-error" role="alert"></p></form><p class="login-note">If this is the first setup, configure <code>WIFI_VENDO_ADMIN_PASSWORD</code> on the server (minimum 12 characters) and restart WiFi Vendo.</p></main><script src="/admin-login.js"></script></body></html>
