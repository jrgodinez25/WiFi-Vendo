name: Build firmware binaries

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/**"
      - "!firmware/releases/**"
      - ".github/workflows/build-firmware.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build all firmware targets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Compile and stage all targets
        shell: bash
        run: |
          set -euo pipefail

          build_target() {
            local environment="$1"
            local filename="$2"
            local output_dir="firmware/releases/$environment"

            pio run --project-dir firmware --environment "$environment"

            mkdir -p "dist/$environment" "$output_dir"
            cp "firmware/.pio/build/$environment/firmware.bin" "dist/$environment/$filename"
            cp "firmware/.pio/build/$environment/firmware.bin" "$output_dir/$filename"
            cp firmware/platformio.ini "dist/$environment/"
            printf 'Environment: %s\nFilename: %s\nSource commit: %s\n' "$environment" "$filename" "$GITHUB_SHA" > "dist/$environment/BUILD-INFO.txt"
            cp "dist/$environment/BUILD-INFO.txt" "$output_dir/BUILD-INFO.txt"
          }

          build_target "esp32-wifi" "esp32_fw.bin"
          build_target "esp32-w5500" "esp32_w5500_fw.bin"
          build_target "esp8266-wifi" "esp8266_fw.bin"

      - name: Upload all firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wifi-vendo-firmware-all-targets
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Commit binaries into repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/releases/
          if git diff --cached --quiet; then
            echo "No firmware binary changes to commit."
          else
            git commit -m "build: publish named ESP firmware binaries [skip ci]"
            git push origin HEAD:main
          fi
