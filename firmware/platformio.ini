[platformio]
default_envs = esp32-wifi, esp32-w5500, esp8266-wifi

[env]
framework = arduino
monitor_speed = 115200
build_flags = -D WIFI_VENDO_LCD_DISABLED=1

[env:esp32-wifi]
platform = espressif32
board = esp32dev

[env:esp32-w5500]
platform = espressif32
board = esp32dev
build_flags = ${env.build_flags} -D WIFI_VENDO_ETH_W5500=1

[env:esp8266-wifi]
platform = espressif8266
board = nodemcuv2
build_flags = ${env.build_flags} -D WIFI_VENDO_ESP8266=1
